<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#173638">
  <link rel="icon" href="data:,">
  <title>BLOOMTIDE — 마당 시승 01</title>
  <style>
    :root { color-scheme:dark; background:#173638; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; overscroll-behavior:none; touch-action:none; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans CJK KR","PingFang SC","Microsoft YaHei",sans-serif; }
    body { padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background:linear-gradient(145deg,#173638,#274c49); }
    #yard { position:fixed; inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); display:grid; place-items:center; }
    #unity-canvas { position:absolute; inset:0; width:100%!important; height:100%!important; display:block; background:#173638; touch-action:none; }
    #start,#rotate,#error { position:absolute; inset:0; display:grid; place-items:center; padding:24px; text-align:center; background:rgba(18,46,46,.94); z-index:5; }
    #start-card { width:min(92vw,620px); }
    #badge { display:inline-block; margin-bottom:12px; padding:6px 12px; border:1px solid rgba(240,193,116,.58); border-radius:999px; color:#f0c174; font-size:13px; }
    h1 { margin:0 0 10px; font-size:clamp(27px,5vw,46px); letter-spacing:.03em; color:#f2e8cf; }
    p { margin:7px 0; color:#d5e4da; line-height:1.48; }
    button { min-height:54px; border:0; border-radius:27px; color:#173638; background:#f0c174; font-family:inherit; font-size:17px; font-weight:700; }
    #start-title,#start-body,#start-button { display:none; }
    #progress-shell { width:min(72vw,420px); height:8px; margin:14px auto 0; border-radius:8px; overflow:hidden; background:rgba(255,255,255,.16); }
    #progress { width:0; height:100%; background:#f0c174; transition:width .15s linear; }
    #rotate,#error { display:none; }
    #version { position:absolute; right:12px; bottom:8px; z-index:8; color:rgba(255,255,255,.62); font-size:11px; pointer-events:none; }
    @media (orientation:portrait) { #rotate { display:grid; z-index:20; } }
    @media (max-height:410px) { #start,#rotate,#error { padding:12px; } #badge { margin-bottom:7px; } h1 { margin-bottom:5px; } p { margin:4px 0; line-height:1.35; } button { min-height:48px; } #start-button { margin-top:8px; } #loading { font-size:13px; } }
  </style>
</head>
<body>
  <main id="yard" aria-label="BLOOMTIDE 마당 시승">
    <canvas id="unity-canvas" tabindex="-1" aria-label="BLOOMTIDE 둘의 마당 게임 화면"></canvas>
    <section id="start">
      <div id="start-card">
        <span id="badge">마당 시승 01</span>
        <h1 id="start-title">둘의 마당을 천천히 둘러보세요</h1>
        <p id="start-body">물건을 꺼내 놓고, 방향을 바꾸고, 주민이 달라진 마당을 사용하는 모습을 지켜보세요.</p>
        <button id="start-button" type="button" aria-hidden="true" tabindex="-1">마당으로 들어가기</button>
        <div id="progress-shell"><div id="progress"></div></div>
        <p id="loading">첫 화면을 준비하고 있습니다.</p>
      </div>
    </section>
    <section id="rotate"><div><h1 id="rotate-title">아이폰을 가로로 돌려주세요</h1><p id="rotate-body">가로 화면에서 둘의 마당을 편하게 둘러볼 수 있습니다.</p></div></section>
    <section id="error"><div><h1 id="error-title">불러오지 못했어요</h1><p id="error-message">마당을 불러오지 못했어요. 새로고침한 뒤 다시 시도해 주세요.</p></div></section>
    <small id="version">마당 시승 01 · 진행은 이 브라우저에만 저장됩니다.</small>
  </main>
  <script src="Build/WebReview.loader.js"></script>
  <script>
    "use strict";
    const STORAGE_KEY="bloomtide.shared-yard.ui-language";
    const UNITY_TARGET="Shared Yard Systems";
    const UNITY_METHOD="SetWebLanguage";
    const copies={
      "ko-KR":{html:"ko",title:"BLOOMTIDE — 마당 시승 01",badge:"마당 시승 01",startTitle:"둘의 마당을 천천히 둘러보세요",startBody:"물건을 꺼내 놓고, 방향을 바꾸고, 주민이 달라진 마당을 사용하는 모습을 지켜보세요.",start:"마당으로 들어가기",initial:"첫 화면을 준비하고 있습니다.",loading:"둘의 마당을 불러오는 중…",rotateTitle:"아이폰을 가로로 돌려주세요",rotateBody:"가로 화면에서 둘의 마당을 편하게 둘러볼 수 있습니다.",errorTitle:"불러오지 못했어요",error:"마당을 불러오지 못했어요. 새로고침한 뒤 다시 시도해 주세요.",version:"마당 시승 01 · 진행은 이 브라우저에만 저장됩니다.",yardAria:"BLOOMTIDE 마당 시승",canvasAria:"BLOOMTIDE 둘의 마당 게임 화면"},
      "zh-Hans":{html:"zh-CN",title:"BLOOMTIDE — 小院试玩 01",badge:"小院试玩 01",startTitle:"慢慢逛逛我们的小院吧",startBody:"把物件拿出来摆一摆、转个方向，再看看居民会怎样使用变化后的院子。",start:"进入小院",initial:"正在准备第一个画面。",loading:"正在打开我们的小院…",rotateTitle:"请把手机横过来",rotateBody:"横屏时会更方便逛逛我们的小院。",errorTitle:"没有顺利打开",error:"小院没有顺利打开，请刷新页面再试一次。",version:"小院试玩 01 · 进度只保存在这个浏览器里。",yardAria:"BLOOMTIDE 小院试玩",canvasAria:"BLOOMTIDE 我们的小院游戏画面"}
    };
    const normalize=value=>{const text=(value||"").trim().toLowerCase();if(text==="zh"||text==="zh-cn"||text==="zh-hans")return "zh-Hans";if(text==="ko"||text==="ko-kr")return "ko-KR";return null;};
    const queryLanguage=normalize(new URLSearchParams(window.location.search).get("lang"));
    let storedLanguage=null;
    try{storedLanguage=normalize(window.localStorage.getItem(STORAGE_KEY));}catch(_){}
    let activeLanguage=queryLanguage||storedLanguage||"ko-KR";
    const canvas=document.querySelector("#unity-canvas"),yard=document.querySelector("#yard"),start=document.querySelector("#start"),button=document.querySelector("#start-button"),progressShell=document.querySelector("#progress-shell"),progress=document.querySelector("#progress"),loading=document.querySelector("#loading"),error=document.querySelector("#error"),errorMessage=document.querySelector("#error-message");
    let booting=false;
    const revision=new URLSearchParams(window.location.search).get("r");
    const assetRevision=revision?"?r="+encodeURIComponent(revision):"";
    const config={dataUrl:"Build/WebReview.data.unityweb"+assetRevision,frameworkUrl:"Build/WebReview.framework.js.unityweb"+assetRevision,codeUrl:"Build/WebReview.wasm.unityweb"+assetRevision,streamingAssetsUrl:"StreamingAssets",companyName:"Bloomtide",productName:"BLOOMTIDE",productVersion:"mobile-world-first-uiux-runtime-v01",cacheControl:url=>revision&&url.includes("?r=")?"immutable":"must-revalidate"};
    function applyCopy(){
      const copy=copies[activeLanguage];
      document.documentElement.lang=copy.html; document.title=copy.title;
      document.querySelector("#badge").textContent=copy.badge; document.querySelector("#start-title").textContent=copy.startTitle; document.querySelector("#start-body").textContent=copy.startBody;
      button.textContent=copy.start;
      if(!booting)loading.textContent=copy.initial; document.querySelector("#rotate-title").textContent=copy.rotateTitle; document.querySelector("#rotate-body").textContent=copy.rotateBody;
      document.querySelector("#error-title").textContent=copy.errorTitle; errorMessage.textContent=copy.error; document.querySelector("#version").textContent=copy.version;
      yard.setAttribute("aria-label",copy.yardAria); canvas.setAttribute("aria-label",copy.canvasAria);
    }
    window.BloomtideSetActiveLanguage=locale=>{
      const language=normalize(locale); if(!language)return;
      activeLanguage=language;
      try{window.localStorage.setItem(STORAGE_KEY,language);}catch(_){}
      try{const url=new URL(window.location.href);url.searchParams.set("lang",language==="zh-Hans"?"zh-Hans":"ko");window.history.replaceState(null,"",url); }catch(_){}
      applyCopy(); document.body.dataset.unityLocaleSync="received";
    };
    function sendLanguage(instance){
      try{instance.SendMessage(UNITY_TARGET,UNITY_METHOD,activeLanguage);document.body.dataset.localeBridge="sent";}
      catch(_){document.body.dataset.localeBridge="unavailable";}
    }
    async function boot(){
      if(booting)return; booting=true; button.disabled=true; progressShell.hidden=false; loading.textContent=copies[activeLanguage].loading;
      try{
        const instance=await createUnityInstance(canvas,config,p=>{progress.style.width=Math.round(p*100)+"%";});
        window.bloomtideUnity=instance; sendLanguage(instance); canvas.style.setProperty("width","100%","important"); canvas.style.setProperty("height","100%","important"); start.style.display="none"; document.querySelector("#version").style.display="none";
        const context=window.AudioContext||window.webkitAudioContext; if(context){try{const audio=new context();await audio.resume();await audio.close();}catch(_){}}
      }catch(reason){console.error("[Bloomtide] Unity load failed",reason);errorMessage.textContent=copies[activeLanguage].error;error.style.display="grid";}
    }
    window.addEventListener("resize",()=>{canvas.style.setProperty("width","100%","important");canvas.style.setProperty("height","100%","important");});
    document.addEventListener("touchmove",event=>event.preventDefault(),{passive:false});
    document.addEventListener("gesturestart",event=>event.preventDefault(),{passive:false});
    window.addEventListener("contextmenu",event=>event.preventDefault());
    applyCopy();
    boot();
  </script>
</body>
</html>
