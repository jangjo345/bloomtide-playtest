<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#173638">
  <link rel="icon" href="data:,">
  <title>BLOOMTIDE — 오늘의 우리 집 01</title>
  <style>
    :root { color-scheme: dark; background:#173638; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; overscroll-behavior:none; touch-action:none; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; }
    body { padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background:linear-gradient(145deg,#173638,#274c49); }
    #stage { position:fixed; inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); display:grid; place-items:center; }
    #unity-canvas { position:absolute; inset:0; width:100%!important; height:100%!important; display:block; background:#173638; touch-action:none; }
    #start,#rotate,#error { position:absolute; inset:0; display:grid; place-items:center; padding:28px; text-align:center; background:rgba(18,46,46,.94); z-index:5; }
    #start-card { max-width:520px; }
    h1 { margin:0 0 12px; font-size:clamp(28px,5vw,48px); letter-spacing:.08em; color:#f2e8cf; }
    p { margin:8px 0; color:#d5e4da; line-height:1.55; }
    button { margin-top:20px; min-width:220px; min-height:56px; border:0; border-radius:28px; color:#173638; background:#f0c174; font-size:18px; font-weight:700; }
    #progress-shell { width:min(72vw,420px); height:8px; margin:18px auto 0; border-radius:8px; overflow:hidden; background:rgba(255,255,255,.16); }
    #progress { width:0; height:100%; background:#f0c174; transition:width .15s linear; }
    #rotate,#error { display:none; }
    #version { position:absolute; right:12px; bottom:8px; z-index:8; color:rgba(255,255,255,.5); font-size:11px; pointer-events:none; }
    @media (orientation:portrait) { #rotate { display:grid; z-index:20; } }
  </style>
</head>
<body>
  <main id="stage" class="lived-in-output" data-bloomtide-slice="lived-in-home-daily-choice-v01" aria-label="BLOOMTIDE 오늘의 우리 집 비공개 검토">
    <canvas id="unity-canvas" tabindex="-1" aria-label="BLOOMTIDE 집 생활·복원·짧은 외출 게임 화면"></canvas>
    <section id="start">
      <div id="start-card">
        <h1>BLOOMTIDE</h1>
        <p id="milestone-copy">집 생활, 복원과 꾸미기, 짧은 바다 외출이 이어지는 제품 milestone입니다.</p>
        <button id="start-button" type="button">우리 집 시작하기</button>
        <div id="progress-shell" hidden><div id="progress"></div></div>
        <p id="loading">첫 탭 뒤 오늘의 우리 집을 불러옵니다.</p>
      </div>
    </section>
    <section id="rotate"><div><h1 id="rotate-title">아이폰을 가로로 돌려주세요</h1><p id="rotate-copy">가로 화면에서 집과 마당, 해안길을 편하게 둘러볼 수 있습니다.</p></div></section>
    <section id="error"><div><h1 id="error-title">불러오지 못했어요</h1><p id="error-message">이 비공개 milestone을 불러오지 못했어요. 새로고침한 뒤 다시 시도해 주세요.</p></div></section>
    <small id="version">LIVED-IN HOME V01 · 진행은 이 브라우저에만 저장됩니다</small>
  </main>
  <script id="lived-in-shell-copy">
    (()=>{const value=(new URLSearchParams(location.search).get("lang")||"").toLowerCase();if(value!=="zh-hans"&&value!=="zh-cn"&&value!=="zh")return;document.documentElement.lang="zh-CN";document.title="BLOOMTIDE — 今天的家 01";document.querySelector("#milestone-copy").textContent="连接居家生活、修复布置和短途出海的产品里程碑。";document.querySelector("#start-button").textContent="进入今天的家";document.querySelector("#loading").textContent="第一次轻触后会打开今天的家。";document.querySelector("#rotate-title").textContent="请把手机横过来";document.querySelector("#rotate-copy").textContent="横屏时更方便查看家、院子和海岸路线。";document.querySelector("#error-title").textContent="没有顺利打开";document.querySelector("#error-message").textContent="这个非公开里程碑没有顺利打开，请刷新后再试。";document.querySelector("#version").textContent="LIVED-IN HOME V01 · 进度只保存在这个浏览器里";})();
  </script>
  <script src="Build/WebReviewRetryV01.loader.js"></script>
  <script>
    "use strict";
    const canvas=document.querySelector("#unity-canvas"),start=document.querySelector("#start"),button=document.querySelector("#start-button"),progressShell=document.querySelector("#progress-shell"),progress=document.querySelector("#progress"),loading=document.querySelector("#loading"),error=document.querySelector("#error"),errorMessage=document.querySelector("#error-message");
    let booting=false;
    const revision=new URLSearchParams(location.search).get("r"),assetSuffix=revision?"?r="+encodeURIComponent(revision):"";
    const config={dataUrl:"Build/WebReviewRetryV01.data.unityweb"+assetSuffix,frameworkUrl:"Build/WebReviewRetryV01.framework.js.unityweb"+assetSuffix,codeUrl:"Build/WebReviewRetryV01.wasm.unityweb"+assetSuffix,streamingAssetsUrl:"StreamingAssets",companyName:"Bloomtide",productName:"Bloomtide",productVersion:"1.0"};
    async function boot(){
      if(booting)return; booting=true; button.disabled=true; progressShell.hidden=false; loading.textContent="오늘의 우리 집을 불러오는 중…";
      try{
        const instance=await createUnityInstance(canvas,config,p=>{progress.style.width=Math.round(p*100)+"%";});
        window.bloomtideUnity=instance; canvas.style.setProperty("width","100%","important"); canvas.style.setProperty("height","100%","important"); start.style.display="none";
        const context=window.AudioContext||window.webkitAudioContext; if(context){ try{const audio=new context(); await audio.resume(); await audio.close();}catch(_){} }
      }catch(reason){ console.error("[Bloomtide] Unity load failed",reason); errorMessage.textContent="이 비공개 milestone을 불러오지 못했어요. 새로고침한 뒤 다시 시도해 주세요."; error.style.display="grid"; }
    }
    button.addEventListener("click",boot,{once:true});
    window.addEventListener("resize",()=>{ canvas.style.setProperty("width","100%","important"); canvas.style.setProperty("height","100%","important"); });
    document.addEventListener("touchmove",event=>event.preventDefault(),{passive:false});
    document.addEventListener("gesturestart",event=>event.preventDefault(),{passive:false});
    window.addEventListener("contextmenu",event=>event.preventDefault());
  </script>
</body>
</html>
